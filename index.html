<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Token Calculator">
    <title>Token Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-font-smoothing: antialiased;
        }
        input {
            -webkit-user-select: text;
        }
        input[type="number"],
        input[type="text"] {
            font-size: 16px;
            padding: 10px;
        }
        input:focus {
            outline: none;
            border-color: #d4af37 !important;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3) !important;
            font-size: 16px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3) !important;
        }
        button {
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            padding-bottom: calc(env(safe-area-inset-bottom) + 0px);
        }
        @media (max-width: 600px) {
            .setup-grid {
                grid-template-columns: 1fr !important;
            }
            .stats-grid { 
                grid-template-columns: 1fr !important; 
            }
            .summary-grid { 
                grid-template-columns: 1fr !important; 
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function TokenCalculator() {
            const [numBuyins, setNumBuyins] = useState('');
            const [players, setPlayers] = useState([]);
            const [buyinAmount, setBuyinAmount] = useState(10);
            const [tokenCounts, setTokenCounts] = useState({});

            const TOKENS_PER_BUYIN = 500;
            const DOLLAR_PER_TOKEN = buyinAmount / TOKENS_PER_BUYIN;
            const totalAvailableTokens = numBuyins ? parseInt(numBuyins) * TOKENS_PER_BUYIN : 0;
            
            const tokenValues = {
                black: 100,
                green: 25,
                blue: 10,
                red: 5,
                white: 1,
            };

            const tokenColors = {
                black: '#1a1a1a',
                green: '#22c55e',
                blue: '#3b82f6',
                red: '#ef4444',
                white: '#f5f5f5',
            };

            const totalTokensEntered = players.reduce((sum, p) => {
                const clickedTotal = (p.tokenHistory || []).reduce((t, v) => t + v, 0);
                return sum + clickedTotal;
            }, 0);
            
            const tokensRemaining = totalAvailableTokens - totalTokensEntered;
            const isBalanced = totalAvailableTokens > 0 && tokensRemaining === 0;
            const hasOverage = tokensRemaining < 0;

            const handleAddPlayer = () => {
                setPlayers([...players, { id: Date.now(), name: '', tokens: '', tokenHistory: [] }]);
            };

            const handleUpdatePlayer = (id, field, value) => {
                setPlayers(players.map(p => p.id === id ? { ...p, [field]: value } : p));
            };

            const handleDeletePlayer = (id) => {
                setPlayers(players.filter(p => p.id !== id));
            };

            const handleTokenClick = (id, value, color) => {
                const key = `${id}-${color}`;
                setTokenCounts(prev => ({
                    ...prev,
                    [key]: (prev[key] || 0) + 1
                }));
                setPlayers(players.map(p => 
                    p.id === id ? { 
                        ...p, 
                        tokenHistory: [...(p.tokenHistory || []), value]
                    } : p
                ));
            };

            const handleUndo = (id) => {
                setPlayers(players.map(p => 
                    p.id === id ? { 
                        ...p, 
                        tokenHistory: (p.tokenHistory || []).slice(0, -1)
                    } : p
                ));
            };

            const handleManualTokenEntry = (id, color, count) => {
                const value = tokenValues[color];
                const totalValue = value * count;
                if (totalValue > 0) {
                    setPlayers(players.map(p => 
                        p.id === id ? { 
                            ...p, 
                            tokenHistory: [...(p.tokenHistory || []), totalValue]
                        } : p
                    ));
                    const key = `${id}-${color}`;
                    setTokenCounts(prev => ({
                        ...prev,
                        [key]: 0
                    }));
                }
            };

            const getPlayerTokenTotal = (player) => {
                return (player.tokenHistory || []).reduce((sum, v) => sum + v, 0);
            };

            const calculatePlayMoney = (player) => {
                const numTokens = getPlayerTokenTotal(player);
                return (numTokens * DOLLAR_PER_TOKEN).toFixed(2);
            };

            return (
                <div style={{
                    maxWidth: '1200px',
                    margin: '0 auto',
                    padding: '20px 16px 40px',
                    background: 'linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%)',
                    minHeight: '100vh',
                }}>
                    {/* HEADER */}
                    <div style={{
                        textAlign: 'center',
                        marginBottom: '48px',
                        paddingBottom: '32px',
                        borderBottom: '3px solid #d4af37',
                    }}>
                        <h1 style={{
                            fontSize: '64px',
                            fontWeight: '900',
                            margin: '0 0 16px 0',
                            color: '#d4af37',
                            textShadow: '4px 4px 8px rgba(0,0,0,0.7)',
                            letterSpacing: '3px',
                        }}>TOKEN CALCULATOR</h1>
                        <p style={{
                            fontSize: '18px',
                            color: '#cbd5e1',
                            margin: 0,
                            fontStyle: 'italic',
                        }}>Convert game tokens to play money</p>
                    </div>

                    {/* SETUP CARD */}
                    <div style={{
                        marginBottom: '48px',
                        background: 'linear-gradient(135deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.95) 100%)',
                        border: '3px solid #d4af37',
                        borderRadius: '16px',
                        padding: '40px',
                        boxShadow: '0 30px 60px rgba(0, 0, 0, 0.5)',
                    }} className="setup-grid">
                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: '1fr 1fr',
                            gap: '32px',
                        }}>
                            <div>
                                <label style={{
                                    display: 'block',
                                    fontSize: '16px',
                                    fontWeight: '800',
                                    color: '#d4af37',
                                    marginBottom: '12px',
                                    textTransform: 'uppercase',
                                    letterSpacing: '2px',
                                }}>Buy-in Amount ($)</label>
                                <input
                                    type="number"
                                    min="1"
                                    step="0.50"
                                    value={buyinAmount}
                                    onChange={(e) => setBuyinAmount(parseFloat(e.target.value) || 10)}
                                    style={{
                                        width: '100%',
                                        padding: '18px 18px',
                                        fontSize: '20px',
                                        border: '2px solid #374151',
                                        borderRadius: '10px',
                                        background: 'rgba(0, 0, 0, 0.3)',
                                        color: '#e5e7eb',
                                        fontWeight: '600',
                                    }}
                                />
                            </div>
                            <div>
                                <label style={{
                                    display: 'block',
                                    fontSize: '16px',
                                    fontWeight: '800',
                                    color: '#d4af37',
                                    marginBottom: '12px',
                                    textTransform: 'uppercase',
                                    letterSpacing: '2px',
                                }}>Number of Buyins</label>
                                <input
                                    type="number"
                                    min="0"
                                    value={numBuyins}
                                    onChange={(e) => setNumBuyins(e.target.value)}
                                    style={{
                                        width: '100%',
                                        padding: '18px 18px',
                                        fontSize: '20px',
                                        border: '2px solid #374151',
                                        borderRadius: '10px',
                                        background: 'rgba(0, 0, 0, 0.3)',
                                        color: '#e5e7eb',
                                        fontWeight: '600',
                                    }}
                                />
                            </div>
                        </div>

                        {numBuyins && (
                            <div style={{
                                display: 'grid',
                                gridTemplateColumns: '1fr 1fr',
                                gap: '24px',
                                marginTop: '24px',
                                padding: '24px',
                                background: 'rgba(212, 175, 55, 0.1)',
                                borderRadius: '10px',
                                borderLeft: '6px solid #d4af37',
                            }} className="stats-grid">
                                <div>
                                    <div style={{
                                        fontSize: '14px',
                                        color: '#9ca3af',
                                        textTransform: 'uppercase',
                                        letterSpacing: '1px',
                                        fontWeight: '600',
                                        marginBottom: '8px',
                                    }}>Total Tokens in Play</div>
                                    <div style={{
                                        fontSize: '32px',
                                        fontWeight: '800',
                                        color: '#d4af37',
                                        fontFamily: '"Menlo", "Monaco", monospace',
                                    }}>{totalAvailableTokens.toLocaleString()}</div>
                                </div>
                                <div>
                                    <div style={{
                                        fontSize: '14px',
                                        color: '#9ca3af',
                                        textTransform: 'uppercase',
                                        letterSpacing: '1px',
                                        fontWeight: '600',
                                        marginBottom: '8px',
                                    }}>Per Buyin</div>
                                    <div style={{
                                        fontSize: '32px',
                                        fontWeight: '800',
                                        color: '#d4af37',
                                        fontFamily: '"Menlo", "Monaco", monospace',
                                    }}>{TOKENS_PER_BUYIN} tokens = ${buyinAmount}</div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* PLAYERS SECTION */}
                    {numBuyins && (
                        <>
                            <div style={{
                                display: 'flex',
                                justifyContent: 'space-between',
                                alignItems: 'center',
                                marginBottom: '28px',
                                paddingBottom: '16px',
                                borderBottom: '2px solid rgba(212, 175, 55, 0.3)',
                            }}>
                                <h2 style={{
                                    fontSize: '28px',
                                    fontWeight: '800',
                                    margin: 0,
                                    color: '#d4af37',
                                    letterSpacing: '2px',
                                }}>PLAYER SETTLEMENTS</h2>
                                <button
                                    onClick={handleAddPlayer}
                                    style={{
                                        display: 'flex',
                                        alignItems: 'center',
                                        padding: '16px 32px',
                                        fontSize: '18px',
                                        fontWeight: '800',
                                        background: 'linear-gradient(135deg, #d4af37 0%, #f4d03f 100%)',
                                        color: '#1a1a1a',
                                        border: 'none',
                                        borderRadius: '10px',
                                        cursor: 'pointer',
                                        minHeight: '52px',
                                        textTransform: 'uppercase',
                                        letterSpacing: '2px',
                                    }}
                                >
                                    + Add Player
                                </button>
                            </div>

                            <div style={{
                                display: 'flex',
                                flexDirection: 'column',
                                gap: '16px',
                                marginBottom: '40px',
                            }}>
                                {players.length === 0 ? (
                                    <div style={{
                                        textAlign: 'center',
                                        padding: '60px 30px',
                                        background: 'linear-gradient(135deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.95) 100%)',
                                        borderRadius: '16px',
                                        border: '3px dashed #d4af37',
                                    }}>
                                        <div style={{
                                            fontSize: '20px',
                                            fontWeight: '700',
                                            color: '#d4af37',
                                            marginBottom: '10px',
                                        }}>No players added yet</div>
                                        <div style={{
                                            fontSize: '16px',
                                            color: '#9ca3af',
                                        }}>Click "Add Player" to start</div>
                                    </div>
                                ) : (
                                    players.map((player) => (
                                        <div key={player.id} style={{
                                            background: 'linear-gradient(135deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.95) 100%)',
                                            border: '2px solid #374151',
                                            borderLeft: '6px solid #d4af37',
                                            borderRadius: '14px',
                                            padding: '24px',
                                            boxShadow: '0 15px 40px rgba(0, 0, 0, 0.4)',
                                        }}>
                                            {/* Player Name and Total */}
                                            <div style={{
                                                display: 'flex',
                                                justifyContent: 'space-between',
                                                alignItems: 'center',
                                                marginBottom: '20px',
                                            }}>
                                                <div style={{ flex: 1 }}>
                                                    <input
                                                        type="text"
                                                        value={player.name}
                                                        onChange={(e) => handleUpdatePlayer(player.id, 'name', e.target.value)}
                                                        style={{
                                                            width: '100%',
                                                            padding: '14px 14px',
                                                            fontSize: '18px',
                                                            border: '2px solid #374151',
                                                            borderRadius: '8px',
                                                            background: 'rgba(0, 0, 0, 0.3)',
                                                            color: '#e5e7eb',
                                                            fontWeight: '600',
                                                        }}
                                                        placeholder="Player Name"
                                                    />
                                                </div>
                                                <div style={{
                                                    display: 'flex',
                                                    flexDirection: 'column',
                                                    alignItems: 'flex-end',
                                                    gap: '6px',
                                                    marginLeft: '20px',
                                                }}>
                                                    <div style={{
                                                        fontSize: '12px',
                                                        color: '#9ca3af',
                                                        textTransform: 'uppercase',
                                                        letterSpacing: '1px',
                                                        fontWeight: '600',
                                                    }}>Total Tokens</div>
                                                    <div style={{
                                                        fontSize: '28px',
                                                        fontWeight: '900',
                                                        color: '#d4af37',
                                                        fontFamily: '"Menlo", "Monaco", monospace',
                                                    }}>
                                                        {getPlayerTokenTotal(player)}
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => handleDeletePlayer(player.id)}
                                                    style={{
                                                        padding: '12px 12px',
                                                        minWidth: '48px',
                                                        minHeight: '48px',
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'center',
                                                        background: 'rgba(239, 68, 68, 0.2)',
                                                        border: '2px solid #ef4444',
                                                        borderRadius: '8px',
                                                        cursor: 'pointer',
                                                        color: '#ef4444',
                                                        marginLeft: '12px',
                                                    }}
                                                >
                                                    ✕
                                                </button>
                                            </div>

                                            {/* Token Buttons with Input Fields */}
                                            <div style={{
                                                display: 'grid',
                                                gridTemplateColumns: 'repeat(5, 1fr)',
                                                gap: '10px',
                                                marginBottom: '16px',
                                            }}>
                                                {Object.entries(tokenValues).map(([color, value]) => (
                                                    <div key={color} style={{
                                                        display: 'flex',
                                                        flexDirection: 'column',
                                                        gap: '6px',
                                                    }}>
                                                        <button
                                                            onClick={() => handleTokenClick(player.id, value, color)}
                                                            style={{
                                                                width: '100%',
                                                                padding: '14px 8px',
                                                                backgroundColor: tokenColors[color],
                                                                border: '2px solid ' + (color === 'white' ? '#9ca3af' : tokenColors[color]),
                                                                borderRadius: '8px',
                                                                cursor: 'pointer',
                                                                fontWeight: '700',
                                                                fontSize: '16px',
                                                                color: color === 'white' ? '#1a1a1a' : '#fff',
                                                                textShadow: color === 'white' ? 'none' : '1px 1px 2px rgba(0,0,0,0.5)',
                                                                transition: 'all 0.2s',
                                                                textTransform: 'uppercase',
                                                                letterSpacing: '1px',
                                                                display: 'flex',
                                                                flexDirection: 'column',
                                                                alignItems: 'center',
                                                                justifyContent: 'center',
                                                                WebkitTouchCallout: 'none',
                                                                WebkitUserSelect: 'none',
                                                            }}
                                                            onMouseDown={(e) => {
                                                                e.currentTarget.style.transform = 'scale(0.95)';
                                                            }}
                                                            onMouseUp={(e) => {
                                                                e.currentTarget.style.transform = 'scale(1)';
                                                            }}
                                                            onTouchStart={(e) => {
                                                                e.currentTarget.style.transform = 'scale(0.95)';
                                                            }}
                                                            onTouchEnd={(e) => {
                                                                e.currentTarget.style.transform = 'scale(1)';
                                                            }}
                                                        >
                                                            <div style={{ fontSize: '18px' }}>{value}</div>
                                                            <div style={{ fontSize: '11px' }}>{color}</div>
                                                        </button>
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            value={tokenCounts[`${player.id}-${color}`] || 0}
                                                            placeholder="0"
                                                            style={{
                                                                width: '100%',
                                                                padding: '8px 6px',
                                                                fontSize: '16px',
                                                                border: '1px solid #374151',
                                                                borderRadius: '6px',
                                                                background: 'rgba(0, 0, 0, 0.3)',
                                                                color: '#e5e7eb',
                                                                textAlign: 'center',
                                                                fontWeight: '600',
                                                                WebkitAppearance: 'none',
                                                            }}
                                                            onChange={(e) => {
                                                                const count = parseInt(e.currentTarget.value) || 0;
                                                                if (count > 0) {
                                                                    handleManualTokenEntry(player.id, color, count);
                                                                    e.currentTarget.value = '0';
                                                                }
                                                            }}
                                                        />
                                                    </div>
                                                ))}
                                            </div>

                                            {/* Undo and Play Money */}
                                            <div style={{
                                                display: 'flex',
                                                justifyContent: 'space-between',
                                                alignItems: 'center',
                                                gap: '12px',
                                            }}>
                                                <button
                                                    onClick={() => handleUndo(player.id)}
                                                    disabled={getPlayerTokenTotal(player) === 0}
                                                    style={{
                                                        padding: '10px 20px',
                                                        fontSize: '14px',
                                                        fontWeight: '700',
                                                        background: getPlayerTokenTotal(player) === 0 ? 'rgba(107, 114, 128, 0.3)' : 'rgba(139, 92, 246, 0.2)',
                                                        color: getPlayerTokenTotal(player) === 0 ? '#6b7280' : '#a78bfa',
                                                        border: '2px solid ' + (getPlayerTokenTotal(player) === 0 ? '#6b7280' : '#a78bfa'),
                                                        borderRadius: '8px',
                                                        cursor: getPlayerTokenTotal(player) === 0 ? 'not-allowed' : 'pointer',
                                                        textTransform: 'uppercase',
                                                        letterSpacing: '1px',
                                                    }}
                                                >
                                                    ↶ Undo
                                                </button>
                                                <div style={{
                                                    display: 'flex',
                                                    flexDirection: 'column',
                                                    alignItems: 'flex-end',
                                                    gap: '4px',
                                                }}>
                                                    <div style={{
                                                        fontSize: '12px',
                                                        color: '#9ca3af',
                                                        textTransform: 'uppercase',
                                                        letterSpacing: '1px',
                                                        fontWeight: '600',
                                                    }}>Play Money</div>
                                                    <div style={{
                                                        fontSize: '28px',
                                                        fontWeight: '900',
                                                        color: '#22c55e',
                                                        fontFamily: '"Menlo", "Monaco", monospace',
                                                        textShadow: '0 0 15px rgba(34, 197, 94, 0.4)',
                                                    }}>
                                                        ${calculatePlayMoney(player)}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>

                            {players.length > 0 && (
                                <div style={{
                                    display: 'grid',
                                    gridTemplateColumns: '1fr',
                                    gap: '20px',
                                }} className="summary-grid">
                                    <div style={{
                                        background: 'linear-gradient(135deg, rgba(31, 41, 55, 0.95) 0%, rgba(17, 24, 39, 0.95) 100%)',
                                        border: '2px solid #374151',
                                        borderLeft: '6px solid #f59e0b',
                                        borderRadius: '14px',
                                        padding: '28px',
                                        boxShadow: '0 15px 40px rgba(0, 0, 0, 0.4)',
                                    }}>
                                        <div style={{
                                            display: 'flex',
                                            justifyContent: 'space-between',
                                            alignItems: 'center',
                                            padding: '14px 0',
                                        }}>
                                            <div style={{
                                                fontSize: '16px',
                                                color: '#a0aec0',
                                                fontWeight: '700',
                                            }}>Total Tokens Entered</div>
                                            <div style={{
                                                fontSize: '22px',
                                                fontWeight: '800',
                                                color: '#e5e7eb',
                                                fontFamily: '"Menlo", "Monaco", monospace',
                                            }}>{totalTokensEntered.toLocaleString()}</div>
                                        </div>
                                        <div style={{
                                            display: 'flex',
                                            justifyContent: 'space-between',
                                            alignItems: 'center',
                                            padding: '14px 0',
                                        }}>
                                            <div style={{
                                                fontSize: '16px',
                                                color: '#a0aec0',
                                                fontWeight: '700',
                                            }}>Total Available</div>
                                            <div style={{
                                                fontSize: '22px',
                                                fontWeight: '800',
                                                color: '#e5e7eb',
                                                fontFamily: '"Menlo", "Monaco", monospace',
                                            }}>{totalAvailableTokens.toLocaleString()}</div>
                                        </div>
                                        <div style={{
                                            height: '2px',
                                            background: 'rgba(212, 175, 55, 0.2)',
                                            margin: '16px 0',
                                        }}></div>
                                        <div style={{
                                            display: 'flex',
                                            justifyContent: 'space-between',
                                            alignItems: 'center',
                                            padding: '14px 0',
                                        }}>
                                            <div style={{
                                                fontSize: '16px',
                                                color: '#a0aec0',
                                                fontWeight: '700',
                                            }}>
                                                {hasOverage ? '❌ Overage' : '✓ Remaining'}
                                            </div>
                                            <div style={{
                                                fontSize: '22px',
                                                fontWeight: '800',
                                                color: hasOverage ? '#ef4444' : '#e5e7eb',
                                                fontFamily: '"Menlo", "Monaco", monospace',
                                            }}>
                                                {Math.abs(tokensRemaining).toLocaleString()}
                                            </div>
                                        </div>
                                        {isBalanced && (
                                            <div style={{
                                                marginTop: '16px',
                                                padding: '12px 16px',
                                                background: 'rgba(34, 197, 94, 0.2)',
                                                color: '#22c55e',
                                                borderRadius: '8px',
                                                fontSize: '14px',
                                                fontWeight: '800',
                                                textAlign: 'center',
                                                border: '2px solid #22c55e',
                                                textTransform: 'uppercase',
                                                letterSpacing: '1px',
                                            }}>✓ Perfectly Balanced</div>
                                        )}
                                    </div>

                                    <div style={{
                                        background: 'linear-gradient(135deg, #d4af37 0%, #f4d03f 100%)',
                                        color: '#1a1a1a',
                                        borderRadius: '14px',
                                        padding: '36px',
                                        display: 'flex',
                                        flexDirection: 'column',
                                        justifyContent: 'center',
                                        alignItems: 'center',
                                        gap: '12px',
                                        boxShadow: '0 30px 60px rgba(212, 175, 55, 0.5)',
                                    }}>
                                        <div style={{
                                            fontSize: '18px',
                                            fontWeight: '900',
                                            textTransform: 'uppercase',
                                            letterSpacing: '2px',
                                            opacity: 0.9,
                                        }}>Total Payout</div>
                                        <div style={{
                                            fontSize: '56px',
                                            fontWeight: '900',
                                            fontFamily: '"Menlo", "Monaco", monospace',
                                            letterSpacing: '2px',
                                        }}>
                                            ${(totalTokensEntered * DOLLAR_PER_TOKEN).toFixed(2)}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<TokenCalculator />);
    </script>
</body>
